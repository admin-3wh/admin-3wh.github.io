app:
  name: "Aletheia"
  description: "Private document intelligence node for local semantic memory and retrieval."
  version: "0.1.0"

storage:
  upload_dir: "uploads/aletheia"

ingestion:
  max_tokens_per_chunk: 500
  min_text_length: 100
  allowed_extensions:
    - ".txt"
    - ".md"
    - ".pdf"

security:
  local_only: true
  allow_public_api: false

retrieval:
  default_top_k: 5
  max_top_k: 20

llm:
  default_mode: "local"
  default_local_model: "gemma2:2b"
